<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Diary</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #eee; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }
    .hidden { display: none !important; }
    h1 { text-align: center; margin: 20px 0; }
    .card { background: #1a1a2e; border-radius: 12px; padding: 24px; margin: 16px 0; }
    input, button, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; font-size: 1rem; }
    input, select, textarea { background: #16213e; color: #eee; }
    input:focus { outline: 2px solid #0f3460; }
    button { background: #0f3460; color: #eee; cursor: pointer; font-weight: 600; }
    button:hover { background: #1a5276; }
    .btn-danger { background: #6b0f1a; }
    .btn-success { background: #1b6b1b; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; margin-top: 16px; }
    .photo-card { background: #1a1a2e; border-radius: 12px; overflow: hidden; }
    .photo-card img { width: 100%; height: 200px; object-fit: cover; display: block; }
    .photo-card .caption { padding: 12px; font-size: 0.9rem; color: #ccc; }
    .photo-card .meta { padding: 0 12px 12px; font-size: 0.75rem; color: #666; }
    .navbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #1a1a2e; flex-wrap: wrap; gap: 8px; }
    .role-badge { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; }
    .role-god { background: #b8860b; color: #000; }
    .role-friend { background: #2e7d32; color: #fff; }
    .role-nothing { background: #555; color: #fff; }
    .tab-bar { display: flex; gap: 8px; margin: 16px 0; }
    .tab { flex: 1; text-align: center; padding: 10px; border-radius: 8px; background: #1a1a2e; cursor: pointer; }
    .tab.active { background: #0f3460; }
    .filter-btn { display: inline-block; padding: 6px 16px; border-radius: 20px; background: transparent; border: 1px solid #333; cursor: pointer; font-size: 0.85rem; margin: 4px; }
    .filter-btn.active { background: #0f3460; border-color: #0f3460; }
    .error { color: #e74c3c; font-size: 0.85rem; margin-top: 8px; }
    .success { color: #2ecc71; font-size: 0.85rem; margin-top: 8px; }
    #loading { text-align: center; color: #666; margin: 40px 0; }
  </style>
</head>
<body>
  <div id="app">
    <!-- Login -->
    <div id="auth-section" class="container" style="max-width:400px;margin-top:80px">
      <div class="card">
        <h2 style="text-align:center;margin-bottom:16px">Photo Diary</h2>
        <div class="tab-bar">
          <div class="tab active" onclick="showTab('login-form')">Sign In</div>
          <div class="tab" onclick="showTab('register-form')">Sign Up</div>
        </div>
        <div id="login-form">
          <input type="email" id="login-email" placeholder="Email" />
          <input type="password" id="login-password" placeholder="Password" />
          <p id="login-error" class="error"></p>
          <button onclick="signIn()">Sign In</button>
        </div>
        <div id="register-form" class="hidden">
          <input type="email" id="reg-email" placeholder="Email" />
          <input type="password" id="reg-password" placeholder="Password (min 6 chars)" />
          <p id="reg-error" class="error"></p>
          <p id="reg-success" class="success"></p>
          <button onclick="signUp()">Sign Up</button>
        </div>
      </div>
    </div>

    <!-- Main App -->
    <div id="main-section" class="hidden">
      <div class="navbar">
        <span><strong>Photo Diary</strong></span>
        <span>
          <span id="role-badge" class="role-badge"></span>
          <span id="user-email" style="font-size:0.8rem;color:#888;margin-left:8px"></span>
          <button onclick="signOut()" style="width:auto;padding:6px 16px;margin-left:12px;font-size:0.8rem" class="btn-danger">Sign Out</button>
        </span>
      </div>
      <div class="container">
        <div class="tab-bar">
          <div class="tab active" onclick="switchTab('gallery')">Gallery</div>
          <div class="tab" onclick="switchTab('upload')">Upload</div>
        </div>
        <div id="gallery-tab">
          <div id="filter-bar" style="margin:12px 0"></div>
          <div id="photo-grid" class="grid"></div>
          <p id="loading">Loading...</p>
        </div>
        <div id="upload-tab" class="hidden">
          <div class="card">
            <h3>Upload Photo</h3>
            <input type="file" id="photo-input" accept="image/*" />
            <input type="text" id="caption-input" placeholder="Caption / diary entry" />
            <label style="font-size:0.85rem;color:#aaa">Visible to:</label>
            <select id="visibility-select">
              <option value="god">God only</option>
              <option value="friend">Friend & God</option>
              <option value="nothing">Everyone</option>
            </select>
            <p id="upload-status" class="error"></p>
            <button onclick="uploadPhoto()">Upload</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://juwqrdmilbbrpoqoggmh.supabase.co';
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp1d3FyZG1pbGJicnBvcW9nZ21oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NTYyMjEsImV4cCI6MjA5NjQzMjIyMX0.izRotsz2UCoBUhiDklnDOpIlYTdd_6NbGN_DexjOGNs';

    let accessToken = null;
    let currentUser = null;
    let currentRole = 'nothing';
    let currentFilter = 'all';

    function api(path, options = {}) {
      const headers = { 'apikey': ANON_KEY, 'Content-Type': 'application/json' };
      if (accessToken) headers['Authorization'] = 'Bearer ' + accessToken;
      return fetch(SUPABASE_URL + path, { ...options, headers })
        .then(async r => { const d = await r.json(); if (!r.ok) throw new Error(d.msg || d.error?.message || d.message || JSON.stringify(d)); return d; });
    }

    // Auth
    async function signUp() {
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      if (!email || !password) return document.getElementById('reg-error').textContent = 'Enter email and password';
      document.getElementById('reg-error').textContent = '';
      document.getElementById('reg-success').textContent = '';
      try {
        const d = await api('/auth/v1/signup', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        document.getElementById('reg-success').textContent = 'Signed up! Switch to Sign In tab and login.';
        document.getElementById('reg-email').value = '';
        document.getElementById('reg-password').value = '';
      } catch (e) {
        document.getElementById('reg-error').textContent = e.message;
      }
    }

    async function signIn() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (!email || !password) return document.getElementById('login-error').textContent = 'Enter email and password';
      document.getElementById('login-error').textContent = '';
      try {
        const d = await api('/auth/v1/token?grant_type=password', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        accessToken = d.access_token;
        currentUser = { id: d.user.id, email: d.user.email };
        await loadProfile();
      } catch (e) {
        document.getElementById('login-error').textContent = e.message;
      }
    }

    async function signOut() {
      if (accessToken) {
        try { await api('/auth/v1/logout', { method: 'POST' }); } catch(e) {}
      }
      accessToken = null;
      currentUser = null;
      document.getElementById('auth-section').classList.remove('hidden');
      document.getElementById('main-section').classList.add('hidden');
    }

    async function loadProfile() {
      try {
        const profiles = await api('/rest/v1/profiles?id=eq.' + currentUser.id + '&select=*');
        let profile = profiles[0];
        if (!profile) {
          await api('/rest/v1/profiles', {
            method: 'POST',
            body: JSON.stringify({ id: currentUser.id, email: currentUser.email, role: 'nothing' })
          });
          currentRole = 'nothing';
        } else {
          currentRole = profile.role;
        }
      } catch(e) {
        currentRole = 'nothing';
      }
      document.getElementById('auth-section').classList.add('hidden');
      document.getElementById('main-section').classList.remove('hidden');
      const badge = document.getElementById('role-badge');
      badge.textContent = 'Role: ' + currentRole;
      badge.className = 'role-badge role-' + currentRole;
      document.getElementById('user-email').textContent = currentUser.email;
      setupFilters();
      loadPhotos();
    }

    function setupFilters() {
      const bar = document.getElementById('filter-bar');
      if (currentRole === 'god') bar.innerHTML = `<span class="filter-btn active" onclick="setF('all')">All</span><span class="filter-btn" onclick="setF('god')">God</span><span class="filter-btn" onclick="setF('friend')">Friend</span><span class="filter-btn" onclick="setF('nothing')">Public</span>`;
      else if (currentRole === 'friend') bar.innerHTML = `<span class="filter-btn active" onclick="setF('all')">All</span><span class="filter-btn" onclick="setF('friend')">Friend</span><span class="filter-btn" onclick="setF('nothing')">Public</span>`;
      else bar.innerHTML = `<span class="filter-btn active" onclick="setF('all')">All</span><span class="filter-btn" onclick="setF('nothing')">Public</span>`;
    }

    function setF(f) {
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.filter-btn').forEach(b => { if (b.textContent.toLowerCase().includes(f)) b.classList.add('active'); });
      loadPhotos();
    }

    // Photos
    async function loadPhotos() {
      const grid = document.getElementById('photo-grid');
      document.getElementById('loading').classList.remove('hidden');
      try {
        let url = '/rest/v1/photos?select=*,profiles(email,role)&order=created_at.desc';
        if (currentFilter !== 'all') url += '&visibility=eq.' + currentFilter;
        else if (currentRole === 'friend') url += '&or=(visibility.eq.friend,visibility.eq.nothing)';
        else if (currentRole === 'nothing') url += '&visibility=eq.nothing';
        const photos = await api(url);
        document.getElementById('loading').classList.add('hidden');
        if (!photos.length) return grid.innerHTML = '<p style="text-align:center;color:#666;grid-column:1/-1">No photos yet</p>';
        grid.innerHTML = photos.map(p => `
          <div class="photo-card">
            <img src="${p.url}" loading="lazy" onerror="this.style.display='none'" />
            <div class="caption">${p.caption || ''}</div>
            <div class="meta">${p.profiles?.email || 'unknown'} · ${p.visibility}</div>
          </div>
        `).join('');
      } catch(e) {
        document.getElementById('loading').classList.add('hidden');
        grid.innerHTML = '<p style="color:#e74c3c">Error: ' + e.message + '</p>';
      }
    }

    async function uploadPhoto() {
      const file = document.getElementById('photo-input').files[0];
      if (!file) return document.getElementById('upload-status').textContent = 'Select a photo';
      const caption = document.getElementById('caption-input').value || '';
      const visibility = document.getElementById('visibility-select').value;
      document.getElementById('upload-status').textContent = 'Uploading...';
      document.getElementById('upload-status').className = 'error';
      try {
        const key = currentUser.id + '/' + Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.]/g, '_');
        const uploadRes = await fetch(SUPABASE_URL + '/storage/v1/object/photos/' + key, {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + accessToken, 'apikey': ANON_KEY, 'Content-Type': file.type || 'application/octet-stream' },
          body: file
        });
        if (!uploadRes.ok) { const e = await uploadRes.json(); throw new Error(e.error || e.message || 'Upload failed'); }
        const finalUrl = SUPABASE_URL + '/storage/v1/object/public/photos/' + key;
        await api('/rest/v1/photos', {
          method: 'POST',
          body: JSON.stringify({ url: finalUrl, caption, uploaded_by: currentUser.id, visibility })
        });
        document.getElementById('upload-status').textContent = 'Uploaded!';
        document.getElementById('upload-status').className = 'success';
        document.getElementById('photo-input').value = '';
        document.getElementById('caption-input').value = '';
        switchTab('gallery');
        loadPhotos();
      } catch(e) {
        document.getElementById('upload-status').textContent = e.message;
      }
    }

    function showTab(tab) {
      document.getElementById('login-form').classList.toggle('hidden', tab !== 'login-form');
      document.getElementById('register-form').classList.toggle('hidden', tab !== 'register-form');
      document.querySelectorAll('#auth-section .tab').forEach(t => t.classList.toggle('active', t.textContent.includes(tab === 'login-form' ? 'Sign In' : 'Sign Up')));
    }

    function switchTab(tab) {
      document.getElementById('gallery-tab').classList.toggle('hidden', tab !== 'gallery');
      document.getElementById('upload-tab').classList.toggle('hidden', tab !== 'upload');
      document.querySelectorAll('#main-section .tab').forEach(t => t.classList.toggle('active', t.textContent.includes(tab === 'gallery' ? 'Gallery' : 'Upload')));
    }
  </script>
</body>
</html>
